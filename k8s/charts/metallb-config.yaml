apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: plw-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.32.200-192.168.32.210
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: plw-l2adv
  namespace: metallb-system
spec:
  ipAddressPools:
  - plw-pool
