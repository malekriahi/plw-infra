- name: Install k3s server on PLW control-plane
  hosts: control_plane
  become: true
  tasks:
    - name: Install k3s server
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s
    - name: Wait for k3s to be ready
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 60
    - name: Read node-token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token
    - name: Store token as fact
      set_fact:
        k3s_token_value: "{{ k3s_token.content | b64decode | trim }}"

- name: Join PLW workers to cluster
  hosts: workers
  become: true
  vars:
    cp_ip: "{{ hostvars['control-plane']['ansible_host'] }}"
    token: "{{ hostvars['control-plane']['k3s_token_value'] }}"
  tasks:
    - name: Install k3s agent
      shell: >
        curl -sfL https://get.k3s.io |
        K3S_URL=https://{{ cp_ip }}:6443
        K3S_TOKEN={{ token }} sh -
      args:
        creates: /usr/local/bin/k3s
