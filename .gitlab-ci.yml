stages:
  - test
  - build-push
  - deploy-dev
  - deploy-staging
  - deploy-prod

variables:
  REGISTRY: "192.168.32.11:5050"
  IMAGE_NAME: "root/planisware-hr"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

# ─── Template SSH réutilisable ───────────────
.ssh_setup: &ssh_setup
  before_script:
    - 'which ssh-agent || apk add --no-cache openssh-client'
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY" /tmp/ssh_key
    - chmod 600 /tmp/ssh_key
    - ssh-add /tmp/ssh_key
    - ssh-keyscan -H 192.168.32.10 >> ~/.ssh/known_hosts

# ─── Stage 1: test ───────────────────────────
test:
  stage: test
  image: node:20-alpine
  tags: [plw]
  script:
    - node --check app/backend/server.js
    - cd app/frontend && npm ci && npm run build
    - echo "Planisware HR tests passed"

# ─── Stage 2: build + push (même job) ────────
build-push:
  stage: build-push
  tags: [plw]
  image: docker:24
  services:
    - name: docker:24-dind
      command: ["--insecure-registry=192.168.32.11:5050"]
  script:
    - docker build -t $REGISTRY/$IMAGE_NAME:$IMAGE_TAG ./app
    - docker tag $REGISTRY/$IMAGE_NAME:$IMAGE_TAG $REGISTRY/$IMAGE_NAME:latest
    - echo "$CI_REGISTRY_PASSWORD" | docker login $REGISTRY
        -u $CI_REGISTRY_USER --password-stdin
    - docker push $REGISTRY/$IMAGE_NAME:$IMAGE_TAG
    - docker push $REGISTRY/$IMAGE_NAME:latest
  only:
    - main

# ─── Stage 3: deploy to dev ──────────────────
deploy-dev:
  stage: deploy-dev
  tags: [plw]
  <<: *ssh_setup
  script:
    - ssh devops@192.168.32.10
        "sudo helm --kubeconfig /home/devops/.kube/config upgrade --install plw-dev
        /opt/plw-charts/planisware-hr
        -n plw-dev --create-namespace
        -f /opt/plw-charts/planisware-hr/values-dev.yaml
        --set image.tag=$IMAGE_TAG
        --set image.repository=$REGISTRY/$IMAGE_NAME
        --wait --timeout=120s"
  only:
    - main

# ─── Stage 4: deploy to staging (manual gate) ───
deploy-staging:
  stage: deploy-staging
  tags: [plw]
  <<: *ssh_setup
  script:
    - ssh devops@192.168.32.10
        "sudo helm --kubeconfig /home/devops/.kube/config upgrade --install plw-staging
        /opt/plw-charts/planisware-hr
        -n plw-staging --create-namespace
        -f /opt/plw-charts/planisware-hr/values-staging.yaml
        --set image.tag=$IMAGE_TAG
        --set image.repository=$REGISTRY/$IMAGE_NAME
        --wait --timeout=120s"
  when: manual
  only:
    - main

# ─── Stage 5: deploy to prod (manual gate) ───
deploy-prod:
  stage: deploy-prod
  tags: [plw]
  <<: *ssh_setup
  script:
    - ssh devops@192.168.32.10
        "sudo helm --kubeconfig /home/devops/.kube/config upgrade --install plw-prod
        /opt/plw-charts/planisware-hr
        -n plw-prod --create-namespace
        -f /opt/plw-charts/planisware-hr/values-prod.yaml
        --set image.tag=$IMAGE_TAG
        --set image.repository=$REGISTRY/$IMAGE_NAME
        --wait --timeout=120s"
  when: manual
  only:
    - main

# ─── Rollback (manual, any branch) ──────────
rollback-prod:
  stage: deploy-prod
  tags: [plw]
  <<: *ssh_setup
  script:
    - ssh devops@192.168.32.10
        "sudo kubectl --kubeconfig /home/devops/.kube/config rollout undo deployment/plw-prod-planisware-hr -n plw-prod"
    - ssh devops@192.168.32.10
        "sudo kubectl --kubeconfig /home/devops/.kube/config rollout status deployment/plw-prod-planisware-hr -n plw-prod"
  when: manual
  only:
    - main
