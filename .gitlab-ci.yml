stages:
  - test
  - build
  - push
  - deploy-dev
  - deploy-prod

variables:
  REGISTRY: "192.168.32.11:5050"
  IMAGE_NAME: "root/planisware-hr"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# ─── Stage 1: test ───────────────────────────
test:
  stage: test
  image: node:20-alpine
  tags: [plw]
  script:
    - node --check app/backend/server.js
    - echo "✅ Planisware-HR syntax check passed"

# ─── Stage 2: build ──────────────────────────
build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  tags: [plw]
  script:
    - docker build -t $REGISTRY/$IMAGE_NAME:$IMAGE_TAG ./app
    - docker tag $REGISTRY/$IMAGE_NAME:$IMAGE_TAG $REGISTRY/$IMAGE_NAME:latest
  only:
    - main

# ─── Stage 3: push ───────────────────────────
push:
  stage: push
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  tags: [plw]
  script:
    - docker login $REGISTRY -u root -p $GITLAB_ROOT_PASSWORD
    - docker push $REGISTRY/$IMAGE_NAME:$IMAGE_TAG
    - docker push $REGISTRY/$IMAGE_NAME:latest
  only:
    - main

# ─── Stage 4: deploy to dev ──────────────────
deploy-dev:
  stage: deploy-dev
  image: alpine:3.18
  tags: [plw]
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H 192.168.32.10 >> ~/.ssh/known_hosts
  script:
    - ssh devops@192.168.32.10
        "sudo kubectl set image deployment/plw-dev-planisware-hr
        planisware-hr=192.168.32.11:5050/root/planisware-hr:$CI_COMMIT_SHORT_SHA
        -n plw-dev"
    - ssh devops@192.168.32.10
        "sudo kubectl rollout status deployment/plw-dev-planisware-hr -n plw-dev"
  only:
    - main

# ─── Stage 5: deploy to prod (manual gate) ───
deploy-prod:
  stage: deploy-prod
  image: alpine:3.18
  tags: [plw]
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H 192.168.32.10 >> ~/.ssh/known_hosts
  script:
    - ssh devops@192.168.32.10
        "sudo kubectl set image deployment/plw-prod-planisware-hr
        planisware-hr=192.168.32.11:5050/root/planisware-hr:$CI_COMMIT_SHORT_SHA
        -n plw-prod"
    - ssh devops@192.168.32.10
        "sudo kubectl rollout status deployment/plw-prod-planisware-hr -n plw-prod"
  when: manual
  only:
    - main

# ─── Rollback prod (manual) ──────────────────
rollback-prod:
  stage: deploy-prod
  image: alpine:3.18
  tags: [plw]
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H 192.168.32.10 >> ~/.ssh/known_hosts
  script:
    - ssh devops@192.168.32.10
        "sudo kubectl rollout undo deployment/plw-prod-planisware-hr -n plw-prod"
  when: manual
  only:
    - main
